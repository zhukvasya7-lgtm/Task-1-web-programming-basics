<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vys</title>
    <style>
        :root {
            color-scheme: dark;
            --gold: #e5c46a;
            --text: #f7f5ef;
            --muted: #c5c1b7;
            --panel: rgba(20, 19, 16, 0.88);
            --line: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    color: var(--text);
    font-family: Arial, sans-serif;
    font-size: 1.3rem;
    background:
        linear-gradient(rgba(10, 10, 10, 0.55), rgba(10, 10, 10, 0.78)),
        url("karel.jpg") center / cover fixed;
            font-size: 18px;
    line-height: 1.8;
}
        a {
    text-decoration: none;
}

.back_menu {
    margin-inline: auto;
    margin-bottom: 8px;
    margin-top: 8px;

    border-radius: 4px;
    border: none;

    color: black;

    background: lightgray;
    padding: 8px;
}

.scale {
    display: flex;
    flex-direction: column;
    align-content: center;

    font-family: Calibri;
    font-weight: 500;
    font-variant-ligatures: normal;
}

.figure {
    background: dimgray;
    display: flex;
    flex-direction: column;
    padding: 10px;
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;
}

.figure img {
    display: block;
    width: 600px;
    height: 400px;
    object-fit: cover;
}

.figcaption {
    background: gray;
    color: var(--gold);
    padding: 3px;
    font-size: 22px;
    text-align: center;
}

.nav {
    width:100%;
    margin-top: 24px;
    display: flex;
    justify-content: center;
}

.nav * {
    margin-inline: 50px;

    border-radius: 4px;
    border: none;

    color: black;

    background: lightgray;
    padding: 8px;
}
    </style>
</head>
<body class="scale">
    <a href="main.html" class="back_menu">Back main</a>

    <figure class="figure">
        <img src="karel%20vys.jfif">
        <figcaption class="figcaption">Карел Готт и Владимир Высоцкий</figcaption>
    </figure>

    <div class="nav">
        <a href="sofia.html">Next</a>
    </div>

</body>
</html>
